name: AudioOnlyiOS
options:
  bundleIdPrefix: com.audioonly
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: 0.4.9

targets:
  AudioOnlyiOS:
    type: application
    platform: iOS
    sources:
      - path: AudioOnlyiOS
    dependencies:
      - package: YouTubeKit
    scheme: {}
    info:
      path: AudioOnlyiOS/Info.plist
      properties:
        CFBundleDisplayName: AudioOnly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 추출한 오디오를 '파일' 앱(나의 iPhone > AudioOnly)에서 볼 수 있게 한다.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 다른 앱에서 '공유 → AudioOnly'로 영상 파일을 넘겨받는다.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.audiovisual-content
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audioonly.ios
        PRODUCT_NAME: AudioOnly
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # 본인의 Apple 개발 팀 ID로 바꾸거나 Xcode의 Signing & Capabilities에서 선택하세요.
        DEVELOPMENT_TEAM: ""
