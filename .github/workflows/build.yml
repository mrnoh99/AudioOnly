name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build AudioOnly.app (universal)
        run: UNIVERSAL=1 DMG=1 ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent AudioOnly.app AudioOnly.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AudioOnly-macOS
          path: |
            build/AudioOnly.zip
            build/AudioOnly.dmg

  ios:
    name: iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd iOS && xcodegen generate
      - name: Build (unsigned, device)
        run: |
          cd iOS
          xcodebuild \
            -project AudioOnlyiOS.xcodeproj \
            -scheme AudioOnlyiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          cd iOS
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AudioOnly.app Payload/
          zip -qry AudioOnly-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AudioOnly-iOS-unsigned
          path: iOS/AudioOnly-unsigned.ipa
