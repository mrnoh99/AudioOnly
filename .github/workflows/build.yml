name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build AudioOnly.app (universal)
        run: UNIVERSAL=1 DMG=1 ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent AudioOnly.app AudioOnly.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AudioOnly
          path: |
            build/AudioOnly.zip
            build/AudioOnly.dmg
